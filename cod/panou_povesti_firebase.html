<!-- ============================================================
     PANOU DE DETECTIV — pagina "Povești"
     Fiecare loc publicat apare ca o fotografie prinsă cu ac pe
     panou. Dacă locul are mai multe poze, ele se rotesc automat,
     doar între pozele acelui loc.

     Se lipește într-un element "Embed" pe pagina Povești.
     Înlocuiește COMPLET codul vechi.

     Fonturile, mărimea scrisului și textele butoanelor se schimbă
     din admin → fila "Aspect site". Nu trebuie modificate în cod.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
  #panou-detectiv{
    --mv-accent:'Dancing Script', Georgia, serif;
    --mv-text:'Lora', Georgia, serif;
    --mv-s:1.15;
    max-width:1200px;margin:0 auto;padding:clamp(20px,5vw,40px) clamp(12px,4vw,24px);
    font-family:var(--mv-text);
  }
  #panou-detectiv .pd-cork{position:relative;background:#8C6A4B;border-radius:10px;padding:clamp(28px,6vw,40px) clamp(16px,4vw,30px);
    box-shadow:inset 0 0 60px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
    background-image:radial-gradient(rgba(0,0,0,0.10) 1px, transparent 1px), radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:14px 14px, 9px 9px; background-position:0 0, 5px 5px;}
  #panou-detectiv .pd-grila{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:44px 28px;}
  #panou-detectiv .pd-carte{display:block;text-decoration:none;color:inherit;position:relative;transition:transform .2s ease;cursor:pointer;}
  #panou-detectiv .pd-hartie{background:#FFFDF8;padding:10px 10px 16px;box-shadow:0 6px 16px rgba(0,0,0,0.35);border-radius:2px;}
  #panou-detectiv .pd-foto{position:relative;width:100%;padding-top:125%;background:#E9E1CF;overflow:hidden;}
  #panou-detectiv .pd-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s ease;}
  #panou-detectiv .pd-film{position:absolute;inset:0;overflow:hidden;background:#1B2B44;}
  #panou-detectiv .pd-film > iframe{position:absolute;top:0;left:50%;height:100%;width:222.3%;transform:translateX(-50%);border:0;pointer-events:none;}
  #panou-detectiv .pd-fara-poza{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;color:#B9AB8E;}
  #panou-detectiv .pd-eticheta{position:absolute;left:8px;top:8px;color:#FFF8EE;font-size:calc(11px * var(--mv-s));font-weight:700;padding:4px 10px;border-radius:10px;z-index:2;font-family:var(--mv-text);}
  #panou-detectiv .pd-nume{padding-top:10px;font-family:var(--mv-accent);font-size:calc(24px * var(--mv-s));font-weight:700;color:#1F3A5F;text-align:center;line-height:1.15;}
  #panou-detectiv .pd-cartier{font-size:calc(14px * var(--mv-s));color:#7A6A48;text-align:center;margin-top:4px;}
  #panou-detectiv .pd-gol{display:none;color:#5B6B75;text-align:center;padding:40px;font-size:calc(16px * var(--mv-s));}
  #panou-detectiv .pd-demo{grid-column:1/-1;text-align:center;margin-top:6px;font-size:calc(13px * var(--mv-s));color:#F2EEE4;opacity:.8;}
  #panou-detectiv .pd-ordine{display:flex;gap:8px;justify-content:center;margin:0 0 18px;flex-wrap:wrap;}
  #panou-detectiv .pd-ordine button{font-family:var(--mv-text);font-size:calc(15px * var(--mv-s));font-weight:700;padding:10px 20px;min-height:44px;border-radius:22px;border:2px solid #1F3A5F;background:#FFFDF8;color:#1F3A5F;cursor:pointer;}
  #panou-detectiv .pd-ordine button.activ{background:#1F3A5F;color:#F2EEE4;}
  #panou-detectiv .pd-butoane{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:36px;}
  #panou-detectiv .pd-btn{color:#F2EEE4;font-family:var(--mv-text);font-size:calc(16px * var(--mv-s));font-weight:700;padding:15px 32px;border-radius:28px;text-decoration:none;}
</style>

<div id="panou-detectiv">
  <div id="panou-gol" class="pd-gol" data-i18n="gol">Niciun loc publicat încă.</div>

    <button type="button" data-o="noi" class="activ" aria-pressed="true" data-i18n="ordNoi">Cele mai noi</button>
    <button type="button" data-o="citite" aria-pressed="false" data-i18n="ordCitite">Cele mai citite</button>

<script>
// ============================================================
// LIMBA ACESTUI COD: 'ro' pe paginile în română, 'en' pe cele în engleză.
// (Fișierul _EN are deja 'en' — nu trebuie modificat nimic.)
// ============================================================
var LIMBA = 'ro';
var PREFIX_EN = '/en';
var SUF = LIMBA === 'en' ? 'En' : '';
var EN = {
  "povestiButon1": "See the map",
  "povestiButon2": "Nominate a place",
  "gol": "No places published yet.",
  "comunitate": "Community",
  "istoric": "History",
  "elevi": "Students",
  "cartier": "neighbourhood",
  "ordNoi": "Newest",
  "ordCitite": "Most read",
  "demo": "— demo examples, they disappear automatically once the first real place is published —"
};
function tr(ro, cheie){ return (LIMBA === 'en' && EN[cheie] !== undefined) ? EN[cheie] : ro; }
function urlSite(cale){ return 'https://memoriavies1.com' + (LIMBA === 'en' ? PREFIX_EN : '') + cale; }
(function(){
  if (LIMBA !== 'en') return;
  try { document.documentElement.lang = 'en'; } catch(e) {}
  Array.prototype.forEach.call(document.querySelectorAll('[data-t],[data-i18n]'), function(el){
    var k = el.getAttribute('data-t') || el.getAttribute('data-i18n');
    if (EN[k] !== undefined) el.textContent = EN[k];
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function(el){
    var k = el.getAttribute('data-i18n-ph'); if (EN[k] !== undefined) el.setAttribute('placeholder', EN[k]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('a[href^="https://memoriavies1.com/"]'), function(a){
    a.href = a.href.replace('https://memoriavies1.com/', 'https://memoriavies1.com' + PREFIX_EN + '/');
  });
})();

</script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAo3nNB04FsZkq0tiKelx4hPD4v1vZbGGk",
    authDomain: "memoriavies1.firebaseapp.com",
    projectId: "memoriavies1",
    storageBucket: "memoriavies1.firebasestorage.app",
    messagingSenderId: "52179319140",
    appId: "1:52179319140:web:a8e85c564cc8a68084a271"
  };
  var PAGINA_LOC = urlSite("/loc");

  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  var db = firebase.firestore();

  var culori = { comunitate: "#1F3A5F", istoric: "#A6431F", elevi: "#B8860B" };
  var etichete = { comunitate: tr("Comunitate","comunitate"), istoric: tr("Istoric","istoric"), elevi: tr("Elevi","elevi") };
  var rotationTimers = [];

  // ---------- aspect și texte din admin ----------
  var SCARA = { normal: 1, mare: 1.15, foarte_mare: 1.3 };
  db.collection('setari').doc('aspect').get().then(function(doc){
    if (!doc.exists) return;
    var a = doc.data(), r = document.getElementById('panou-detectiv');
    if (a.fontAccent) r.style.setProperty('--mv-accent', "'" + a.fontAccent + "', Georgia, serif");
    if (a.fontText) r.style.setProperty('--mv-text', "'" + a.fontText + "', Georgia, serif");
    if (SCARA[a.marime]) r.style.setProperty('--mv-s', SCARA[a.marime]);
    Array.prototype.forEach.call(r.querySelectorAll('[data-t]'), function(el){
      var v = a[el.getAttribute('data-t') + SUF];
      var f = a[el.getAttribute('data-t') + 'Font'];
      if (typeof f === 'string' && f.trim()) el.style.fontFamily = "'" + f + "', Georgia, serif";
      if (typeof v === 'string' && v.trim()) el.textContent = v;
    });
  }).catch(function(err){ console.warn('[povesti] setări aspect indisponibile, folosesc varianta de bază', err); });

  function esc(s){
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // navighează pagina MARE (nu iframe-ul Hostinger) către pagina locului
  function mergiLaLoc(id){
    var url = PAGINA_LOC + '?id=' + encodeURIComponent(id);
    try { localStorage.setItem('memoriavie_loc_id', id); } catch(e) {}
    try { window.top.location.href = url; return; } catch(e) {}
    try { window.open(url, '_top'); return; } catch(e) {}
    window.location.href = url;
  }

  // Pozele demo apar DOAR pentru exemplele demo. Un loc real fără poză
  // primește o hârtie simplă cu o iconiță, nu o poză străină la întâmplare.
  function seedFromId(id){
    var h = 0;
    for (var i = 0; i < id.length; i++) { h = ((h << 5) - h + id.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function getPhotoSet(d, id, esteDemo){
    if (Array.isArray(d.poze) && d.poze.length) return d.poze;
    if (d.fotoURL) return [d.fotoURL];
    if (esteDemo) {
      var s = seedFromId(id), out = [];
      for (var i = 0; i < 3; i++) out.push('https://picsum.photos/seed/' + s + '-' + i + '/500/650');
      return out;
    }
    return [];
  }

  var locuriDemo = [
    { id: 'demo-1', nume: 'Curtea cu liliac din Str. Rezervelor', cartier: 'Grivița', categorie: 'comunitate' },
    { id: 'demo-2', nume: 'Foișorul de la colț', cartier: 'Aviatorilor', categorie: 'istoric' },
    { id: 'demo-3', nume: 'Locul de joacă „la scări"', cartier: 'Băneasa', categorie: 'elevi' },
    { id: 'demo-4', nume: 'Brutăria de pe strada veche', cartier: 'Dorobanți', categorie: 'comunitate' }
  ];

  function ytMut(u){
    if (/^https:\/\/\S+\.mp4(\?\S*)?$/i.test(String(u || '').trim())) return String(u).trim();
    var m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
    if (!m) return '';
    var v = m[1];
    return v;
  }
  function randare(docuri, esteDemo){
    rotationTimers.forEach(function(t){ clearInterval(t); });
    rotationTimers = [];

    var container = document.getElementById('panou-container');
    document.getElementById('panou-gol').style.display = 'none';
    document.getElementById('panou-cork').style.display = 'block';
    container.innerHTML = '';

    docuri.forEach(function(item, i){
      var d = item.data, id = item.id;
      var poze = getPhotoSet(d, id, esteDemo);
      var tilt = (i % 2 === 0 ? -1 : 1) * (2 + (i % 3));

      var hook = document.createElement('a');
      hook.className = 'pd-carte';
      if (!esteDemo) {
        hook.href = PAGINA_LOC + '?id=' + encodeURIComponent(id);
        hook.target = '_top'; hook.rel = 'noopener';
        hook.addEventListener('click', function(e){ e.preventDefault(); mergiLaLoc(id); });
      } else {
        hook.setAttribute('role', 'presentation');
        hook.style.cursor = 'default';
      }
      hook.style.transform = 'rotate(' + tilt + 'deg)';
      hook.onmouseenter = function(){ hook.style.transform = 'rotate(0deg) scale(1.03)'; };
      hook.onmouseleave = function(){ hook.style.transform = 'rotate(' + tilt + 'deg) scale(1)'; };

      var pinSVG =
        '<svg width="22" height="22" viewBox="0 0 22 22" style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));">' +
          '<circle cx="11" cy="9" r="7" fill="#A6431F" stroke="#5c2311" stroke-width="1"/>' +
          '<circle cx="8.5" cy="6.5" r="2" fill="rgba(255,255,255,0.55)"/>' +
          '<rect x="9.5" y="14" width="3" height="6" rx="1.3" fill="#3a2a18"/>' +
        '</svg>';

      var filmSrc = esteDemo ? '' : ytMut(d.videoYoutube);
      var fotoHTML = filmSrc
        ? '<div class="pd-film"><div data-mvhd-mut="' + esc(filmSrc) + '" data-cover="1" style="position:absolute;inset:0;"></div></div>'
        : poze.length
        ? poze.map(function(url, idx){
            return '<img src="' + esc(url) + '" alt="" loading="lazy" style="opacity:' + (idx === 0 ? 1 : 0) + ';">';
          }).join('')
        : '<div class="pd-fara-poza">📍</div>';

      var eticheta = etichete[d.categorie]
        ? '<div class="pd-eticheta" style="background:' + culori[d.categorie] + ';">' + etichete[d.categorie] + '</div>'
        : '';

      hook.innerHTML =
        pinSVG +
        '<div class="pd-hartie">' +
          '<div class="pd-foto">' + fotoHTML + eticheta + '</div>' +
          '<div class="pd-nume">' + esc(d.nume) + '</div>' +
          (d.cartier ? '<div class="pd-cartier">' + (LIMBA === 'en' ? esc(d.cartier) + ' ' + EN.cartier : 'Cartier ' + esc(d.cartier)) + '</div>' : '') +
        '</div>';

      container.appendChild(hook);

      if (!filmSrc && poze.length > 1) {
        (function(imgs){
          var current = 0;
          var timer = setInterval(function(){
            var prev = current;
            current = (current + 1) % imgs.length;
            imgs[prev].style.opacity = 0;
            imgs[current].style.opacity = 1;
          }, 3500 + Math.random() * 800);
          rotationTimers.push(timer);
        })(hook.querySelectorAll('img'));
      }
    });

    if (esteDemo) {
      var notaDemo = document.createElement('div');
      notaDemo.className = 'pd-demo';
      notaDemo.textContent = tr('— exemple demo, dispar automat când publici primul loc real —','demo');
      container.appendChild(notaDemo);
    }
  }

  // ---------- ordinea poveștilor ----------
  // „Cele mai noi”: întâi cele cu „Fixează sus” bifat în admin, apoi după „Data publicării pe site”
  // (pusă/modificată în admin), de la cea mai nouă la cea mai veche.
  // „Cele mai citite”: după numărul de afișări ale paginii fiecărui loc.
  function timp(x){
    var t = x.data.createdAt;
    return t && t.toMillis ? t.toMillis() : 0;
  }
  function dataPub(x){
    var p = String(x.data.publicatLa || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return Date.parse(p + 'T12:00:00');
    return timp(x);
  }
  var ordine = 'noi', ultimele = [], afisari = null, seIncarca = false;
  function sorteaza(docuri){
    var d = docuri.slice();
    if (ordine === 'citite' && afisari) {
      d.sort(function(a, b){ return (afisari[b.id] || 0) - (afisari[a.id] || 0) || dataPub(b) - dataPub(a); });
    } else {
      d.sort(function(a, b){
        var fa = a.data.fixatSus ? 1 : 0, fb = b.data.fixatSus ? 1 : 0;
        if (fa !== fb) return fb - fa;
        return dataPub(b) - dataPub(a);
      });
    }
    return d;
  }
  function butoane(){
    Array.prototype.forEach.call(document.querySelectorAll('#panou-ordine button'), function(b){
      var activ = b.getAttribute('data-o') === ordine;
      b.className = activ ? 'activ' : ''; b.setAttribute('aria-pressed', activ ? 'true' : 'false');
    });
  }
  function ascundeCitite(){
    var b = document.querySelector('#panou-ordine button[data-o="citite"]');
    if (b) document.getElementById('panou-ordine').style.display = 'none';
    ordine = 'noi'; butoane();
  }
  function incarcaAfisari(){
    if (afisari || seIncarca) return Promise.resolve();
    seIncarca = true;
    return Promise.all(ultimele.map(function(x){
      return db.collection('statistici').doc('loc_' + x.id).get().then(function(s){ return [x.id, s.exists ? (s.data().n || 0) : 0]; });
    })).then(function(rez){
      afisari = {}; rez.forEach(function(r){ afisari[r[0]] = r[1]; });
    }).catch(function(e){
      console.warn('Afișările nu pot fi citite (reguli Firestore pentru „statistici”):', e);
      ascundeCitite();
    }).then(function(){ seIncarca = false; });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#panou-ordine button'), function(b){
    b.addEventListener('click', function(){
      ordine = b.getAttribute('data-o'); butoane();
      if (ordine === 'citite') incarcaAfisari().then(function(){ if (ultimele.length) randare(sorteaza(ultimele), false); });
      else if (ultimele.length) randare(sorteaza(ultimele), false);
    });
  });

  db.collection('locuri').where('stare', '==', 'publicat')
    .onSnapshot(function(snapshot){
      if (snapshot.empty) {
        document.getElementById('panou-ordine').style.display = 'none';
        randare(locuriDemo.map(function(d){ return { id: d.id, data: d }; }), true);
        return;
      }
      var docuri = [];
      snapshot.forEach(function(doc){ docuri.push({ id: doc.id, data: doc.data() }); });
      ultimele = docuri; afisari = null;
      if (ordine === 'citite') incarcaAfisari().then(function(){ randare(sorteaza(ultimele), false); });
      else randare(sorteaza(docuri), false);
    }, function(eroare){
      console.error('Eroare Firestore panou Povești:', eroare);
      randare(locuriDemo.map(function(d){ return { id: d.id, data: d }; }), true);
    });
})();
</script>

<!-- ============================================================
     CONTOR DE VIZITE (fără cookie-uri, nu salvează nimic despre vizitator,
     doar numără). Cifrele apar în admin, la fila „Raport”.
     ============================================================ -->
<script>
(function(){
  function zi(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function inc(k){ try{ firebase.firestore().collection('statistici').doc(k).set({ n: firebase.firestore.FieldValue.increment(1) }, { merge:true }).catch(function(){}); }catch(e){} }
  function odata(k){ try{ if (sessionStorage.getItem('mv_'+k)) return false; sessionStorage.setItem('mv_'+k,'1'); }catch(e){} return true; }
  function gata(){ return window.firebase && firebase.apps && firebase.apps.length; }
  window.mvInc = function(cheie){ if (gata()) inc(cheie); };
  window.mvNumara = function(cheie){ if (gata() && odata(cheie)) inc(cheie); };
  window.mvVizita = function(pagina){
    if (!gata()) return;
    if (window.LIMBA === 'en') pagina += '_en';
    if (odata('vizitator')) { inc('vizitatori'); inc('vizitatori_' + zi()); }
    inc('pag_' + pagina); inc('afisari_' + zi());   // afișare de pagină: se numără la fiecare încărcare
  };
  mvVizita('povesti');
})();
</script>

<script>
/* ============================================================
   MVHD — videoclipuri YouTube în calitate mare pe Memoria vie.
   Playerul YouTube e încărcat în spate la 1920×1080 (filme cu sunet)
   sau 1280×720 (previzualizări fără sunet) și micșorat doar vizual,
   ca YouTube să trimită calitate HD. Butoanele sunt ale noastre.
   ============================================================ */
window.MVHD = window.MVHD || (function(){
  var TXT_EN = { play: 'Play', pauza: 'Pause', sunet: 'Sound on', fara: 'Mute', ecran: 'Full screen' };
  var TXT_RO = { play: 'Pornește', pauza: 'Pauză', sunet: 'Pornește sunetul', fara: 'Oprește sunetul', ecran: 'Pe tot ecranul' };
  var TXT = new Proxy({}, { get: function(o, k){ return (window.LIMBA === 'en' ? TXT_EN : TXT_RO)[k]; } });
  var MARE = [1920, 1080], PREVIZ = [1280, 720];

  // ---------- filme găzduite de noi, mereu 1080p (au prioritate față de YouTube) ----------
  var MP4_BAZA = 'https://purcaru94-star.github.io/memoria-vie-video/';
  var MP4 = window.MVHD_MP4 || {
    'vbR5GdC3b_c': 'grupaj-dorobanti-final',
    'B4hsEnRZiMk': 'bunica',
    'EmmhTOvXxZc': 'doamna-din-padure',
    'h66-Cf2CFDc': 'sebastian-grecu'
  };
  function mp4De(id){
    id = String(id || '');
    if (/^https:\/\/.+\.mp4(\?|$)/i.test(id)) return { src: id, poster: id.replace(/\.mp4(\?.*)?$/i, '.jpg') };
    var n = MP4[id]; if (!n) return null;
    return { src: MP4_BAZA + n + '.mp4', poster: MP4_BAZA + n + '.jpg' };
  }

  var css = document.createElement('style');
  css.textContent =
    '.mvhd-box{position:relative;overflow:hidden;background:#000;}' +
    '.mvhd-in{position:absolute;left:0;top:0;transform-origin:0 0;}' +
    '.mvhd-in iframe{display:block;width:100%;height:100%;border:0;}' +

  function player(box, id, opt){
