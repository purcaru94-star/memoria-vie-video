<!-- ============================================================
     HARTA — desenul cu cartiere, plasat EXACT peste harta reală,
     folosind cele 3 colțuri calculate din coordonatele Stereo70
     din fișierul .tif original.

     Se lipește într-un element "Embed" pe pagina "Harta".
     Înlocuiește COMPLET codul vechi.

     REPARAT în această versiune:
     - linkul "Vezi povestea" folosește adresa completă a site-ului
       și navighează explicit în pagina mare (nu în iframe-ul Hostinger)
     - toată fereastra popup-ului e clickabilă, nu doar textul
     - id-ul locului e salvat în browser la click, ca rezervă
     - coordonatele salvate ca text sunt acceptate și ele
     - pinii nu se mai dublează când se actualizează datele
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Lora:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Source+Sans+3:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">

<style>
  #mv-harta-radacina{ --mv-accent:'Dancing Script', Georgia, serif; --mv-text:'Lora', Georgia, serif; --mv-s:1.15; }
  .mv-popup-card { display:block; text-decoration:none; color:inherit; cursor:pointer; font-family:var(--mv-text); min-width:200px; }
  .mv-popup-nume { font-family:var(--mv-accent); font-size:calc(22px * var(--mv-s)); font-weight:700; color:#1F3A5F; line-height:1.15; margin-bottom:3px; }
  .mv-popup-det { font-size:calc(13px * var(--mv-s)); color:#5B6B75; }
  .mv-popup-adr { font-size:calc(12px * var(--mv-s)); color:#5B6B75; margin-top:2px; }
  .mv-popup-link { display:inline-block; margin-top:8px; font-size:calc(14px * var(--mv-s)); color:#A6431F; font-weight:700; }
  .mv-cartier-eticheta { background:none; border:none; }
  .mv-cartier-eticheta span {
    display:block; white-space:nowrap; transform:translate(-50%,-50%);
    font-family:'Lora', Georgia, serif; font-style:italic; font-weight:600;

    color:#4E3D28; opacity:0.88;

    pointer-events:none; user-select:none; transition:opacity .2s;
  }
  .mv-cartier-eticheta span.ascuns { opacity:0; }
  #mv-harta-titlu { font-family:var(--mv-accent); font-size:calc(clamp(24px,6.5vw,34px) * var(--mv-s)); font-weight:700; color:#1F3A5F; margin:0 0 8px; }
  #mv-harta-sub { font-family:var(--mv-text); font-size:calc(clamp(14px,3.6vw,16px) * var(--mv-s)); color:#5B6B75; margin:0; line-height:1.55; }
  .mv-popup-card:hover .mv-popup-link { text-decoration:underline; }
  .mv-popup-card:focus-visible { outline:2px solid #B8860B; outline-offset:3px; border-radius:6px; }

<div style="position:relative;background:#F2EEE4;padding:clamp(20px,6vw,34px) clamp(16px,5vw,24px) clamp(16px,4vw,26px) clamp(16px,5vw,24px);text-align:center;font-family:'Playfair Display',Georgia,serif;

<script>
// ============================================================
// LIMBA ACESTUI COD: 'ro' pe paginile în română, 'en' pe cele în engleză.
// (Fișierul _EN are deja 'en' — nu trebuie modificat nimic.)
// ============================================================
var LIMBA = 'ro';
var PREFIX_EN = '/en';
var SUF = LIMBA === 'en' ? 'En' : '';
var EN = {
  "hartaTitlu": "The Living Memory of the Neighbourhoods of Sector 1",
  "hartaSubtitlu": "Every pin is a place with a story, nominated by a resident of Sector 1. Click for details.",
  "hartaLink": "Read the story",
  "comunitate": "Community",
  "istoric": "History",
  "elevi": "Students",
  "cartier": "neighbourhood"
};
function tr(ro, cheie){ return (LIMBA === 'en' && EN[cheie] !== undefined) ? EN[cheie] : ro; }
function urlSite(cale){ return 'https://memoriavies1.com' + (LIMBA === 'en' ? PREFIX_EN : '') + cale; }
(function(){
  if (LIMBA !== 'en') return;
  try { document.documentElement.lang = 'en'; } catch(e) {}
  Array.prototype.forEach.call(document.querySelectorAll('[data-t],[data-i18n]'), function(el){
    var k = el.getAttribute('data-t') || el.getAttribute('data-i18n');
    if (EN[k] !== undefined) el.textContent = EN[k];
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function(el){
    var k = el.getAttribute('data-i18n-ph'); if (EN[k] !== undefined) el.setAttribute('placeholder', EN[k]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('a[href^="https://memoriavies1.com/"]'), function(a){
    a.href = a.href.replace('https://memoriavies1.com/', 'https://memoriavies1.com' + PREFIX_EN + '/');
  });
})();

</script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAo3nNB04FsZkq0tiKelx4hPD4v1vZbGGk",
    authDomain: "memoriavies1.firebaseapp.com",
    projectId: "memoriavies1",
    storageBucket: "memoriavies1.firebasestorage.app",
    messagingSenderId: "52179319140",
    appId: "1:52179319140:web:a8e85c564cc8a68084a271"
  };
  // adresa COMPLETĂ a paginii loc — nu doar "/loc", pentru că în
  // iframe-ul Hostinger "/loc" poate duce pe alt domeniu
  var PAGINA_LOC = urlSite("/loc");
  var IMAGINE_HARTA = "https://res.cloudinary.com/hkx27e6q/image/upload/v1790579622/harta_cartiere_cu_nume.png";
  // ============================================================

  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  var db = firebase.firestore();

  // ---------- aspect din admin (fonturi, mărime, texte) ----------
  var SCARA = { normal: 1, mare: 1.15, foarte_mare: 1.3 };
  var textLink = tr('Vezi povestea','hartaLink');
  db.collection('setari').doc('aspect').get().then(function(doc){
    if (!doc.exists) return;
    var a = doc.data(), r = document.getElementById('mv-harta-radacina');
    if (a.fontAccent) r.style.setProperty('--mv-accent', "'" + a.fontAccent + "', Georgia, serif");
    if (a.fontText) r.style.setProperty('--mv-text', "'" + a.fontText + "', Georgia, serif");
    if (SCARA[a.marime]) r.style.setProperty('--mv-s', SCARA[a.marime]);
    function fontPentru(cheie, el){ var f = a[cheie + 'Font']; if (el && typeof f === 'string' && f.trim()) el.style.fontFamily = "'" + f + "', Georgia, serif"; }
    fontPentru('hartaTitlu', document.getElementById('mv-harta-titlu'));
    fontPentru('hartaSubtitlu', document.getElementById('mv-harta-sub'));
    if (a.hartaLinkFont) {
      var st = document.createElement('style');
      st.textContent = ".mv-popup-link{font-family:'" + String(a.hartaLinkFont).replace(/'/g,'') + "', Georgia, serif !important;}";
      document.head.appendChild(st);
    }
    if (a['hartaTitlu'+SUF]) document.getElementById('mv-harta-titlu').textContent = a['hartaTitlu'+SUF];
    if (a['hartaSubtitlu'+SUF]) document.getElementById('mv-harta-sub').textContent = a['hartaSubtitlu'+SUF];
    if (a['hartaLink'+SUF]) {
      textLink = a['hartaLink'+SUF];
      Array.prototype.forEach.call(document.querySelectorAll('.mv-popup-link'), function(el){ el.textContent = textLink; });
    }
  }).catch(function(err){ console.warn('[harta] setări aspect indisponibile, folosesc varianta de bază', err); });

  var culori = { comunitate: "#1F3A5F", istoric: "#A6431F", elevi: "#B8860B" };
  var etichete = { comunitate: tr("Comunitate","comunitate"), istoric: tr("Istoric","istoric"), elevi: tr("Elevi","elevi") };
  var iconiteSVG = {
    istoric:
      '<path d="M12 2 L14.5 5 L9.5 5 Z" fill="#fff"/><rect x="10.5" y="5" width="3" height="2" fill="#fff"/>' +
      '<circle cx="12" cy="11" r="6" fill="none" stroke="#fff" stroke-width="1.6"/>' +
      '<path d="M12 7.5 V11 L15 12.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>' +
      '<rect x="8" y="17.5" width="8" height="2" rx="0.5" fill="#fff"/>',
    comunitate:
      '<rect x="5" y="12" width="14" height="1.8" rx="0.5" fill="#fff"/><rect x="5" y="15.2" width="14" height="1.8" rx="0.5" fill="#fff"/>' +
      '<rect x="6" y="13.8" width="1.6" height="6" fill="#fff"/><rect x="16.4" y="13.8" width="1.6" height="6" fill="#fff"/>' +
      '<rect x="6" y="7" width="1.6" height="5" fill="#fff"/><rect x="16.4" y="7" width="1.6" height="5" fill="#fff"/>' +
      '<rect x="6" y="6.2" width="12" height="1.6" rx="0.5" fill="#fff"/>',
    elevi:
      '<path d="M4 6.5 C7 5 9.5 5.3 12 6.8 V18 C9.5 16.5 7 16.2 4 17.7 Z" fill="#fff"/>' +
      '<path d="M20 6.5 C17 5 14.5 5.3 12 6.8 V18 C14.5 16.5 17 16.2 20 17.7 Z" fill="#fff"/>'
  };

  function esc(s){
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  // Pin simplu cu iconița categoriei (pentru locurile fără poză)
  function iconPentru(categorie){
    var D = Math.max(12, Math.round(marimePin() * 0.7));
    var culoare = culori[categorie] || "#5B6B75";
    var svgInterior = iconiteSVG[categorie] || '<circle cx="12" cy="12" r="4" fill="#fff"/>';
    var html =
      '<div style="width:' + D + 'px;height:' + D + 'px;border-radius:50%;background:' + culoare + ';' +
      'border:' + (D < 20 ? 1.5 : 2.5) + 'px solid #FFF8EE;box-shadow:0 2px 5px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;box-sizing:border-box;">' +
        (D >= 20 ? '<svg width="' + Math.round(D * 0.58) + '" height="' + Math.round(D * 0.58) + '" viewBox="0 0 24 24">' + svgInterior + '</svg>' : '') +
      '</div>';
    return L.divIcon({ html: html, className: '', iconSize: [D, D], iconAnchor: [D / 2, D / 2], popupAnchor: [0, -D / 2] });
  }

  // Poze mici pentru pini: la Cloudinary cerem direct o variantă de 120px,
  // ca harta să se încarce repede chiar cu multe locuri.
  function miniatura(url){
    if (!url) return '';
    return String(url).replace(/\/image\/upload\/(?!c_)/, '/image/upload/c_fill,w_120,h_120,g_auto,q_auto,f_auto/');
  }

  // Pin cu poza locului: cerc cu poza, ramă în culoarea categoriei,
  // vârf care arată exact locul și o iconiță mică a categoriei.
  // Mărimea pinului după zoom: mic de departe, crește când te apropii.
  var MARIMI_PIN = { 10: 14, 11: 16, 12: 20, 13: 26, 14: 34, 15: 42, 16: 50 };
  function marimePin(){
    var z = harta ? Math.round(harta.getZoom()) : 13;
    if (z <= 10) return 14;
    if (z >= 16) return 50;
    return MARIMI_PIN[z];
  }
  function iconCuPoza(categorie, poza){
    var M = marimePin();
    var culoare = culori[categorie] || "#5B6B75";
    var svgInterior = iconiteSVG[categorie] || '<circle cx="12" cy="12" r="4" fill="#fff"/>';
    var fallback = "this.style.display='none';this.nextElementSibling.style.display='flex';";
    var rama = M < 24 ? 2 : 3;                 // rama colorată
    var alb = M < 24 ? 1 : 2;                  // conturul alb
    var coada = Math.max(4, Math.round(M * 0.26)); // vârful pinului
    var lat = Math.max(3, Math.round(coada * 0.6));
    var arataIconita = M >= 34;                // iconița categoriei doar de aproape
    var ic = Math.round(M * 0.36);
    var H = M + coada - 2;
    var html =
      '<div style="position:relative;width:' + M + 'px;height:' + H + 'px;filter:drop-shadow(0 2px ' + (M < 24 ? 2 : 4) + 'px rgba(0,0,0,0.35));">' +
        '<div style="position:absolute;left:0;top:0;width:' + M + 'px;height:' + M + 'px;border-radius:50%;background:' + culoare + ';padding:' + rama + 'px;box-sizing:border-box;">' +
          '<div style="width:100%;height:100%;border-radius:50%;overflow:hidden;border:' + alb + 'px solid #FFF8EE;box-sizing:border-box;background:#E9E1CF;">' +
            '<img src="' + esc(miniatura(poza)) + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="' + fallback + '">' +
            '<div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;background:' + culoare + ';">' +
              '<svg width="' + Math.round(M * 0.45) + '" height="' + Math.round(M * 0.45) + '" viewBox="0 0 24 24">' + svgInterior + '</svg>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="position:absolute;left:50%;top:' + (M - 2) + 'px;transform:translateX(-50%);width:0;height:0;' +
          'border-left:' + lat + 'px solid transparent;border-right:' + lat + 'px solid transparent;border-top:' + coada + 'px solid ' + culoare + ';"></div>' +
        (arataIconita ?
          '<div style="position:absolute;right:-3px;top:-3px;width:' + ic + 'px;height:' + ic + 'px;border-radius:50%;background:' + culoare + ';' +
            'border:1.5px solid #FFF8EE;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">' +
            '<svg width="' + Math.round(ic * 0.6) + '" height="' + Math.round(ic * 0.6) + '" viewBox="0 0 24 24">' + svgInterior + '</svg>' +
          '</div>' : '') +
      '</div>';
    return L.divIcon({
      html: html, className: '',
      iconSize: [M, H],
      iconAnchor: [M / 2, H],                  // vârful pinului = locul exact
      popupAnchor: [0, -H + 2]
    });
  }

  // Navighează pagina MARE (nu iframe-ul) către pagina locului.
  // Încearcă pe rând mai multe metode, pentru că Hostinger poate
  // bloca una sau alta.
  function mergiLaLoc(id){
    var url = PAGINA_LOC + '?id=' + encodeURIComponent(id);
    try { localStorage.setItem('memoriavie_loc_id', id); } catch(e) {}
    try { window.top.location.href = url; return; } catch(e) {}
    try { window.open(url, '_top'); return; } catch(e) {}
    window.location.href = url;
  }

  var harta = L.map('harta-memoria-vie').setView([44.4700, 26.0700], 12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS',
    maxZoom: 19
  }).addTo(harta);

  // Cele 3 colțuri exacte, din coordonatele Stereo70 ale fișierului .tif
  var stangaSus   = L.latLng(44.560755, 25.981849);
  var dreaptaSus  = L.latLng(44.559473, 26.119457);
  var stangaJos   = L.latLng(44.421660, 25.979487);

  var stratDesen = L.imageOverlay.rotated(IMAGINE_HARTA, stangaSus, dreaptaSus, stangaJos, {
    opacity: 0.8
  }).addTo(harta);
  harta.fitBounds(stratDesen.getBounds());

  // Culorile de cartier se estompează la zoom mare, ca să se vadă străzile
  function actualizeazaOpacitate(){
    var z = harta.getZoom();
    var opacitate;
    if (z <= 13) opacitate = 0.8;
    else if (z <= 14) opacitate = 0.55;
    else if (z <= 15) opacitate = 0.3;
    else if (z <= 16) opacitate = 0.12;
    else opacitate = 0;
    stratDesen.setOpacity(opacitate);
  }
  harta.on('zoomend', actualizeazaOpacitate);
  actualizeazaOpacitate();

  // Numele cartierelor sunt desenate direct în imaginea hărții (IMAGINE_HARTA),
  // ca pe harta de print, așa că se măresc și se micșorează odată cu harta.

  var stratPini = L.layerGroup().addTo(harta);
  // Pinii cu poză se micșorează la vederea de ansamblu, ca să nu acopere cartierele.
  harta.on('zoomend', function(){
    stratPini.eachLayer(function(m){ m.setIcon(m._mvPoza ? iconCuPoza(m._mvCategorie, m._mvPoza) : iconPentru(m._mvCategorie)); });
  });

  function ytMut(u){
    if (/^https:\/\/\S+\.mp4(\?\S*)?$/i.test(String(u || '').trim())) return String(u).trim();
    var m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
    if (!m) return '';
    var v = m[1];
    return v;
  }
  db.collection('locuri').where('stare', '==', 'publicat')
    .onSnapshot(function(snapshot){
      stratPini.clearLayers();

      snapshot.forEach(function(doc){
        var d = doc.data();
        var lat = parseFloat(d.lat), lng = parseFloat(d.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        var id = doc.id;
        var poza = (Array.isArray(d.poze) && d.poze[0]) || d.fotoURL || '';
        var icon = poza ? iconCuPoza(d.categorie, poza) : iconPentru(d.categorie);
        var marker = L.marker([lat, lng], { icon: icon, title: d.nume || '', riseOnHover: true }).addTo(stratPini);
        marker._mvPoza = poza; marker._mvCategorie = d.categorie;
        var pozaHTML = poza ? '<img src="' + esc(poza) + '" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block;">' : '';
        // dacă povestea are film YouTube: îl arătăm în locul pozei, pornit, fără sunet, în buclă
        var filmSrc = ytMut(d.videoYoutube);
        if (filmSrc) pozaHTML = '<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;margin-bottom:6px;background:#1B2B44;">' +
          '<div data-mvhd-mut="' + esc(filmSrc) + '" data-cover="1" style="position:absolute;inset:0;"></div></div>';
        var adresaHTML = d.adresa ? '<div class="mv-popup-adr">' + esc(d.adresa) + '</div>' : '';
        var detalii = [etichete[d.categorie], d.cartier ? (LIMBA === 'en' ? esc(d.cartier) + ' ' + EN.cartier : 'Cartier ' + esc(d.cartier)) : ''].filter(Boolean).join(', ');

        var url = PAGINA_LOC + '?id=' + encodeURIComponent(id);

        marker.bindPopup(function(){
          return '<a class="mv-popup-card" href="' + url + '" target="_top" rel="noopener" data-loc-id="' + esc(id) + '">' +
            pozaHTML +
            '<div class="mv-popup-nume">' + esc(d.nume) + '</div>' +
            '<div class="mv-popup-det">' + detalii + '</div>' +
            adresaHTML +
            '<span class="mv-popup-link">' + esc(textLink) + '</span>' +
          '</a>';
        });
      });
    }, function(eroare){
      console.error('Eroare Firestore hartă:', eroare);
    });

  // Click oriunde în popup → pagina locului.
  // Leaflet construiește popup-ul la deschidere, așa că legăm click-ul atunci.
  harta.on('popupopen', function(e){
    var card = e.popup.getElement() && e.popup.getElement().querySelector('.mv-popup-card');
    if (!card) return;
    L.DomEvent.on(card, 'click', function(ev){
      L.DomEvent.preventDefault(ev);
      L.DomEvent.stopPropagation(ev);
      mergiLaLoc(card.getAttribute('data-loc-id'));
    });
  });
})();
</script>

<!-- ============================================================
     CONTOR DE VIZITE (fără cookie-uri, nu salvează nimic despre vizitator,
     doar numără). Cifrele apar în admin, la fila „Raport”.
     ============================================================ -->
<script>
(function(){
  function zi(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function inc(k){ try{ firebase.firestore().collection('statistici').doc(k).set({ n: firebase.firestore.FieldValue.increment(1) }, { merge:true }).catch(function(){}); }catch(e){} }
  function odata(k){ try{ if (sessionStorage.getItem('mv_'+k)) return false; sessionStorage.setItem('mv_'+k,'1'); }catch(e){} return true; }
  function gata(){ return window.firebase && firebase.apps && firebase.apps.length; }
  window.mvInc = function(cheie){ if (gata()) inc(cheie); };
  window.mvNumara = function(cheie){ if (gata() && odata(cheie)) inc(cheie); };
  window.mvVizita = function(pagina){
    if (!gata()) return;
    if (window.LIMBA === 'en') pagina += '_en';
    if (odata('vizitator')) { inc('vizitatori'); inc('vizitatori_' + zi()); }
    inc('pag_' + pagina); inc('afisari_' + zi());   // afișare de pagină: se numără la fiecare încărcare
  };
  mvVizita('harta');
})();
</script>

<script>
/* ============================================================
   MVHD — videoclipuri YouTube în calitate mare pe Memoria vie.
   Playerul YouTube e încărcat în spate la 1920×1080 (filme cu sunet)
   sau 1280×720 (previzualizări fără sunet) și micșorat doar vizual,
   ca YouTube să trimită calitate HD. Butoanele sunt ale noastre.
   ============================================================ */
window.MVHD = window.MVHD || (function(){
  var TXT_EN = { play: 'Play', pauza: 'Pause', sunet: 'Sound on', fara: 'Mute', ecran: 'Full screen' };
  var TXT_RO = { play: 'Pornește', pauza: 'Pauză', sunet: 'Pornește sunetul', fara: 'Oprește sunetul', ecran: 'Pe tot ecranul' };
  var TXT = new Proxy({}, { get: function(o, k){ return (window.LIMBA === 'en' ? TXT_EN : TXT_RO)[k]; } });
  var MARE = [1920, 1080], PREVIZ = [1280, 720];

  // ---------- filme găzduite de noi, mereu 1080p (au prioritate față de YouTube) ----------
  var MP4_BAZA = 'https://purcaru94-star.github.io/memoria-vie-video/';
  var MP4 = window.MVHD_MP4 || {
    'vbR5GdC3b_c': 'grupaj-dorobanti-final',
    'B4hsEnRZiMk': 'bunica',
    'EmmhTOvXxZc': 'doamna-din-padure',
    'h66-Cf2CFDc': 'sebastian-grecu'
  };
  function mp4De(id){
    id = String(id || '');
    if (/^https:\/\/.+\.mp4(\?|$)/i.test(id)) return { src: id, poster: id.replace(/\.mp4(\?.*)?$/i, '.jpg') };
    var n = MP4[id]; if (!n) return null;
    return { src: MP4_BAZA + n + '.mp4', poster: MP4_BAZA + n + '.jpg' };
  }

  var css = document.createElement('style');
  css.textContent =
    '.mvhd-box{position:relative;overflow:hidden;background:#000;}' +
    '.mvhd-in{position:absolute;left:0;top:0;transform-origin:0 0;}' +
    '.mvhd-in iframe{display:block;width:100%;height:100%;border:0;}' +
    '.mvhd-clic{position:absolute;inset:0;cursor:pointer;background:transparent;border:0;padding:0;}' +
    '.mvhd-bara{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:1;transition:opacity .3s;}' +
    '.mvhd-box.mvhd-ruleaza:not(:hover):not(.mvhd-fara-sunet) .mvhd-bara{opacity:0;}' +
    '@media (hover:none){.mvhd-box .mvhd-bara{opacity:1 !important;}}' +
    '.mvhd-bara button,.mvhd-bara a{min-width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.16);color:#fff;font:700 13px/1 system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;text-decoration:none;}' +
    '.mvhd-bara button:hover,.mvhd-bara a:hover{background:rgba(255,255,255,.3);}' +
    '.mvhd-bara svg{width:20px;height:20px;fill:#fff;}' +
    '.mvhd-timp{flex:1;min-width:60px;height:44px;display:flex;align-items:center;}' +
    '.mvhd-timp input{width:100%;accent-color:#C2562A;cursor:pointer;}' +
    '.mvhd-ora{color:#fff;font:12px system-ui,sans-serif;white-space:nowrap;}' +
    '.mvhd-calit{color:#fff;font:700 11px system-ui,sans-serif;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 6px;white-space:nowrap;}' +
    '.mvhd-calit:empty{display:none;}' +
    '.mvhd-mare{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:rgba(194,86,42,.92);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);}' +
    '.mvhd-mare svg{width:30px;height:30px;fill:#fff;margin-left:4px;}' +
    '.mvhd-box.mvhd-ruleaza .mvhd-mare{display:none;}' +
    '.mvhd-box:fullscreen{width:100vw;height:100vh;}' +
    '@media (max-width:600px){.mvhd-ora{display:none;}.mvhd-bara{gap:4px;padding:6px;}}';
  document.head.appendChild(css);

  var I = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pauza: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
    sunet: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
    fara: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm18.7 1.3-1.4-1.4L18 11.2l-2.3-2.3-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4 2.3-2.3 2.3 2.3 1.4-1.4-2.3-2.3z"/></svg>',
    ecran: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'
  };

  function potrivire(box, inner, dim, cover){
    function f(){
      var w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
      var s = cover ? Math.max(w / dim[0], h / dim[1]) : Math.min(w / dim[0], h / dim[1]);
      inner.style.transform = 'translate(' + ((w - dim[0] * s) / 2) + 'px,' + ((h - dim[1] * s) / 2) + 'px) scale(' + s + ')';
    }
    f();
    if (window.ResizeObserver) new ResizeObserver(f).observe(box); else window.addEventListener('resize', f);
    document.addEventListener('fullscreenchange', function(){ setTimeout(f, 60); });
    return f;
  }
  function interior(box, dim, cover){
    box.classList.add('mvhd-box');
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    var inner = document.createElement('div'); inner.className = 'mvhd-in';
    inner.style.width = dim[0] + 'px'; inner.style.height = dim[1] + 'px';
    box.appendChild(inner); potrivire(box, inner, dim, cover);
    return inner;
  }

  // ---------- previzualizare fără sunet, fără butoane (hartă, panou) ----------
  function mut(box, id, cover){
    if (box._mvhd) return; box._mvhd = 1;
    var m4 = mp4De(id);
    if (m4) {
      box.classList.add('mvhd-box');
      if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
      var v = document.createElement('video');
      v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.preload = 'metadata'; v.poster = m4.poster; v.src = m4.src;
      v.setAttribute('aria-hidden', 'true'); v.tabIndex = -1;
      v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:' + (cover ? 'cover' : 'contain') + ';pointer-events:none;';
      box.appendChild(v);
      var joaca = function(on){ if (on) { var pr = v.play(); if (pr && pr.catch) pr.catch(function(){}); } else v.pause(); };
      if (window.IntersectionObserver) new IntersectionObserver(function(es){ es.forEach(function(e){ joaca(e.isIntersecting); }); }, { threshold: 0.25 }).observe(box);
      else joaca(true);
      return;
    }
    var inner = interior(box, PREVIZ, cover);
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&loop=1&playlist=' + id + '&controls=0&playsinline=1&rel=0&modestbranding=1&disablekb=1&iv_load_policy=3&vq=hd720';
    f.setAttribute('allow', 'autoplay; encrypted-media'); f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true'); f.title = '';
    f.style.pointerEvents = 'none';
    inner.appendChild(f);
  }

  // ---------- API YouTube ----------
  var asteptare = [];
  function api(cb){
    if (window.YT && window.YT.Player) return cb();
    asteptare.push(cb);
    if (api.pornit) return; api.pornit = 1;
    var vechi = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){ if (vechi) try { vechi(); } catch(e){} asteptare.splice(0).forEach(function(f){ f(); }); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function ora(t){ t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }

  // ---------- player cu sunet și butoanele noastre ----------
  // opt: { autoplay, muted, loop, titlu }
  function player(box, id, opt){
    opt = opt || {};
    if (box._mvhdP) return box._mvhdP;
    if (mp4De(id)) return playerMp4(box, id, opt);
    box.innerHTML = '';
    var inner = interior(box, MARE, false);
    var slot = document.createElement('div'); inner.appendChild(slot);
    var clic = document.createElement('button'); clic.type = 'button'; clic.className = 'mvhd-clic'; clic.setAttribute('aria-label', TXT.play + (opt.titlu ? ': ' + opt.titlu : ''));
    var mare = document.createElement('button'); mare.type = 'button'; mare.className = 'mvhd-mare'; mare.setAttribute('aria-label', TXT.play); mare.innerHTML = I.play;
    var bara = document.createElement('div'); bara.className = 'mvhd-bara';
    bara.innerHTML =
      '<button type="button" data-a="play" aria-label="' + TXT.play + '">' + I.play + '</button>' +
      '<div class="mvhd-timp"><input type="range" min="0" max="1000" value="0" step="1" aria-label="Poziție"></div>' +
      '<span class="mvhd-ora">0:00 / 0:00</span>' +
      '<span class="mvhd-calit" title="Calitatea trimisă acum de YouTube"></span>' +
      '<button type="button" data-a="sunet" aria-label="' + TXT.fara + '">' + I.sunet + '</button>' +
      '<button type="button" data-a="ecran" aria-label="' + TXT.ecran + '">' + I.ecran + '</button>' +
      '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener" aria-label="YouTube HD">HD</a>';
    box.appendChild(clic); box.appendChild(mare); box.appendChild(bara);
    var bPlay = bara.querySelector('[data-a="play"]'), bSunet = bara.querySelector('[data-a="sunet"]'), bEcran = bara.querySelector('[data-a="ecran"]');
    var cursor = bara.querySelector('input'), eticheta = bara.querySelector('.mvhd-ora'), calit = bara.querySelector('.mvhd-calit');
    var CAL = { tiny: '144p', small: '240p', medium: '360p', large: '480p', hd720: '720p', hd1080: '1080p', hd1440: '1440p', hd2160: '4K', highres: '4K+' };
    var p = null, gata = false, trage = false, muted = !!opt.muted, timer = null;

    function stareSunet(){ box.classList.toggle('mvhd-fara-sunet', muted); bSunet.innerHTML = muted ? I.fara : I.sunet; bSunet.setAttribute('aria-label', muted ? TXT.sunet : TXT.fara); }
    function stareRuleaza(r){ box.classList.toggle('mvhd-ruleaza', r); bPlay.innerHTML = r ? I.pauza : I.play; bPlay.setAttribute('aria-label', r ? TXT.pauza : TXT.play); }
    function comuta(){ if (!gata) return; var s = p.getPlayerState(); if (s === 1 || s === 3) p.pauseVideo(); else p.playVideo(); }
    stareSunet();
    clic.addEventListener('click', comuta); mare.addEventListener('click', comuta); bPlay.addEventListener('click', comuta);
    bSunet.addEventListener('click', function(){ if (!gata) return; if (muted) { p.unMute(); p.setVolume(100); } else p.mute(); muted = !muted; stareSunet(); });
    bEcran.addEventListener('click', function(){
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      var cere = box.requestFullscreen || box.webkitRequestFullscreen;
      if (cere) { try { var r = cere.call(box); if (r && r.catch) r.catch(function(){ window.open('https://www.youtube.com/watch?v=' + id, '_blank'); }); } catch(e){ window.open('https://www.youtube.com/watch?v=' + id, '_blank'); } }
      else window.open('https://www.youtube.com/watch?v=' + id, '_blank');
    });
    cursor.addEventListener('input', function(){ trage = true; });
    cursor.addEventListener('change', function(){ if (gata) p.seekTo(p.getDuration() * cursor.value / 1000, true); trage = false; });

    api(function(){
      p = new YT.Player(slot, {
        host: 'https://www.youtube-nocookie.com', videoId: id, width: MARE[0], height: MARE[1],
        playerVars: { vq: 'hd1080', autoplay: opt.autoplay ? 1 : 0, mute: muted ? 1 : 0, controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, disablekb: 1, loop: opt.loop ? 1 : 0, playlist: opt.loop ? id : undefined },
        events: {
          onReady: function(){
            gata = true;
            try { var f = p.getIframe(); f.setAttribute('tabindex', '-1'); f.style.pointerEvents = 'none'; } catch(e){}
            if (muted) p.mute();
            if (opt.autoplay) p.playVideo();
            timer = setInterval(function(){
              if (!gata) return; var d = p.getDuration() || 0, t = p.getCurrentTime() || 0;
              if (!trage && d) cursor.value = Math.round(1000 * t / d);
              eticheta.textContent = ora(t) + ' / ' + ora(d);
              try { var q = p.getPlaybackQuality && p.getPlaybackQuality(); calit.textContent = CAL[q] || ''; } catch(e){}
            }, 500);
          },
          onStateChange: function(e){ stareRuleaza(e.data === 1 || e.data === 3); }
        }
      });
    });
    box._mvhdP = { opreste: function(){ if (gata) p.pauseVideo(); } };
    return box._mvhdP;
  }


  // ---------- player pentru filmele noastre (mp4 1080p), aceleași butoane ----------
  function playerMp4(box, id, opt){
    var m4 = mp4De(id);
    box.innerHTML = '';
    box.classList.add('mvhd-box');
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    var v = document.createElement('video');
    v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.poster = m4.poster; v.src = m4.src; v.loop = !!opt.loop;
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;';
    var clic = document.createElement('button'); clic.type = 'button'; clic.className = 'mvhd-clic'; clic.setAttribute('aria-label', TXT.play + (opt.titlu ? ': ' + opt.titlu : ''));
    var mare = document.createElement('button'); mare.type = 'button'; mare.className = 'mvhd-mare'; mare.setAttribute('aria-label', TXT.play); mare.innerHTML = I.play;
    var bara = document.createElement('div'); bara.className = 'mvhd-bara';
    bara.innerHTML =
      '<button type="button" data-a="play" aria-label="' + TXT.play + '">' + I.play + '</button>' +
      '<div class="mvhd-timp"><input type="range" min="0" max="1000" value="0" step="1" aria-label="Poziție"></div>' +
      '<span class="mvhd-ora">0:00 / 0:00</span>' +
      '<span class="mvhd-calit"></span>' +
      '<button type="button" data-a="sunet" aria-label="' + TXT.fara + '">' + I.sunet + '</button>' +
      '<button type="button" data-a="ecran" aria-label="' + TXT.ecran + '">' + I.ecran + '</button>';
    box.appendChild(v); box.appendChild(clic); box.appendChild(mare); box.appendChild(bara);
    var bPlay = bara.querySelector('[data-a="play"]'), bSunet = bara.querySelector('[data-a="sunet"]'), bEcran = bara.querySelector('[data-a="ecran"]');
    var cursor = bara.querySelector('input'), eticheta = bara.querySelector('.mvhd-ora'), calit = bara.querySelector('.mvhd-calit');
    var trage = false, muted = !!opt.muted; v.muted = muted;
    function stareSunet(){ box.classList.toggle('mvhd-fara-sunet', muted); bSunet.innerHTML = muted ? I.fara : I.sunet; bSunet.setAttribute('aria-label', muted ? TXT.sunet : TXT.fara); }
    function stareRuleaza(){ var r = !v.paused && !v.ended; box.classList.toggle('mvhd-ruleaza', r); bPlay.innerHTML = r ? I.pauza : I.play; bPlay.setAttribute('aria-label', r ? TXT.pauza : TXT.play); }
    function porneste(){ var pr = v.play(); if (pr && pr.catch) pr.catch(function(){ if (!v.muted) { v.muted = muted = true; stareSunet(); v.play().catch(function(){}); } }); }
    function comuta(){ if (v.paused || v.ended) porneste(); else v.pause(); }
    stareSunet();
    clic.addEventListener('click', comuta); mare.addEventListener('click', comuta); bPlay.addEventListener('click', comuta);
    bSunet.addEventListener('click', function(){ muted = !muted; v.muted = muted; if (!muted) v.volume = 1; stareSunet(); });
    bEcran.addEventListener('click', function(){
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      var cere = box.requestFullscreen || box.webkitRequestFullscreen;
      if (cere) { try { var r = cere.call(box); if (r && r.catch) r.catch(function(){ if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); }); } catch(e){ if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); } }
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    });
    cursor.addEventListener('input', function(){ trage = true; });
    cursor.addEventListener('change', function(){ if (v.duration) v.currentTime = v.duration * cursor.value / 1000; trage = false; });
    ['play','pause','ended','playing'].forEach(function(e){ v.addEventListener(e, stareRuleaza); });
    v.addEventListener('timeupdate', function(){ var d = v.duration || 0, t = v.currentTime || 0; if (!trage && d) cursor.value = Math.round(1000 * t / d); eticheta.textContent = ora(t) + ' / ' + ora(d); });
    v.addEventListener('loadedmetadata', function(){ eticheta.textContent = ora(0) + ' / ' + ora(v.duration); if (v.videoHeight) calit.textContent = v.videoHeight + 'p'; });
    if (opt.autoplay) porneste();
    box._mvhdP = { opreste: function(){ v.pause(); } };
    return box._mvhdP;
  }

  // ---------- inițializare automată ----------
  // <div data-mvhd-mut="ID" data-cover="1"></div>            previzualizare fără sunet
  // <div data-mvhd-play="ID" data-titlu="..."></div>          imagine + buton; la apăsare pornește playerul HD
  function initFacade(box){
    if (box._mvhdF) return; box._mvhdF = 1;
    var id = box.getAttribute('data-mvhd-play'), titlu = box.getAttribute('data-titlu') || '';
    box.classList.add('mvhd-box');
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    if (!box.style.aspectRatio && !box.clientHeight) box.style.aspectRatio = '16/9';
    var m4f = mp4De(id); box.innerHTML = '<img src="' + (m4f ? m4f.poster : 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg') + '" onload="if(this.naturalWidth&lt;=120&&this.src.indexOf(&#39;maxres&#39;)>-1)this.src=this.src.replace(&#39;maxresdefault&#39;,&#39;hqdefault&#39;)" onerror="if(this.src.indexOf(&#39;maxres&#39;)>-1)this.src=this.src.replace(&#39;maxresdefault&#39;,&#39;hqdefault&#39;)" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">' +
      '<button type="button" class="mvhd-mare" aria-label="' + TXT.play + (titlu ? ': ' + titlu.replace(/"/g, '') : '') + '" style="display:flex">' + I.play + '</button>';
    box.querySelector('button').addEventListener('click', function(){
      box.innerHTML = ''; box._mvhdP = null;
      player(box, id, { autoplay: true, titlu: titlu });
      if (window.mvInc) try { window.mvInc('film_' + id); } catch(e){}
    });
  }
  function scan(root){
    if (!root || !root.querySelectorAll) return;
    Array.prototype.forEach.call(root.querySelectorAll('[data-mvhd-mut]'), function(b){ mut(b, b.getAttribute('data-mvhd-mut'), b.getAttribute('data-cover') === '1'); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-mvhd-play]'), initFacade);
  }
  function porneste(){
    scan(document);
    new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes, function(n){ if (n.nodeType === 1) { if (n.hasAttribute && (n.hasAttribute('data-mvhd-mut') || n.hasAttribute('data-mvhd-play'))) scan(n.parentNode); else scan(n); } }); }); })
      .observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', porneste); else porneste();

  function idDin(u){ var m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/); return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(String(u || '')) ? u : ''); }
  return { mut: mut, player: player, scan: scan, id: idDin };
})();
</script>
